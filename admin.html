<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0b0d14" />
  <title>Social Web · Admin</title>
  <link rel="stylesheet" href="/assets/css/core.css" />
  <link rel="stylesheet" href="/assets/css/panel.css" />
</head>
<body class="panel-body">
  <div class="bg-animated" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <!-- LOGIN -->
  <div id="login-view" class="panel-login">
    <div class="panel-card">
      <div class="panel-logo">
        <div class="logo-mark">
          <svg viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="14" fill="url(#la)"/><circle cx="24" cy="24" r="11" stroke="#fff" stroke-width="2.5"/><circle cx="24" cy="24" r="4" fill="#fff"/><defs><linearGradient id="la" x1="0" y1="0" x2="48" y2="48"><stop stop-color="#6c5ce7"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs></svg>
        </div>
        <h1>Admin Login</h1>
        <p class="sub">Only accounts with role = admin</p>
      </div>
      <form id="admin-login-form" class="panel-form">
        <div class="field">
          <label>Username</label>
          <input type="text" id="admin-user" autocomplete="username" required />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="admin-pass" autocomplete="current-password" required />
        </div>
        <p id="admin-error" class="form-error hidden"></p>
        <button type="submit" class="btn primary full">Login as Admin</button>
      </form>
      <p class="panel-hint">Use the same password you registered with. Account must have role = 2.</p>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dash-view" class="panel-dash hidden">
    <header class="panel-top">
      <div class="brand">Admin Panel</div>
      <div class="who" id="admin-who"></div>
      <button type="button" class="btn ghost" id="admin-logout">Logout</button>
    </header>
    <main class="panel-main">
      <h2>Members</h2>
      <div id="user-list" class="user-list">Loading…</div>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/admin.js"></script>
</body>
</html>
