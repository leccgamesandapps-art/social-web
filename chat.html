<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0b0d14" />
  <title>Social Web · Chat</title>
  <link rel="stylesheet" href="/assets/css/core.css" />
  <link rel="stylesheet" href="/assets/css/chat.css" />
</head>
<body class="chat-body">
  <div class="bg-animated" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div id="guard" class="loader-screen">
    <div class="spinner"></div>
    <p>Checking session…</p>
  </div>

  <div id="app" class="chat-app hidden">
    <header class="chat-top1">
      <a href="/dashboard#home" class="back-feed">← Feed</a>
      <div class="brand-center">
        <div class="logo-mark xs">
          <svg viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="14" fill="url(#lc)"/><circle cx="24" cy="24" r="11" stroke="#fff" stroke-width="2.5"/><circle cx="24" cy="24" r="4" fill="#fff"/><defs><linearGradient id="lc" x1="0" y1="0" x2="48" y2="48"><stop stop-color="#6c5ce7"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs></svg>
        </div>
        <span>Chat</span>
      </div>
      <button type="button" class="btn-icon" id="btn-new" title="New">＋</button>
    </header>

    <div class="chat-top2">
      <button type="button" class="ctab active" data-tab="chat">Chat</button>
      <button type="button" class="ctab" data-tab="gc">GC</button>
      <button type="button" class="ctab" data-tab="community">Community</button>
    </div>

    <div class="chat-body-area">
      <aside class="chat-list" id="chat-list">
        <div class="empty-state sm">Loading…</div>
      </aside>

      <section class="chat-pane" id="chat-pane">
        <div class="chat-pane-empty" id="pane-empty">
          <p>Select a chat, GC, or community</p>
        </div>
        <div class="chat-conversation hidden" id="pane-conv">
          <div class="conv-head" id="conv-head"></div>
          <div class="conv-messages" id="conv-messages"></div>
          <div class="conv-input-row">
            <input type="text" id="msg-input" placeholder="Message…" autocomplete="off" />
            <button type="button" class="btn primary" id="btn-send">Send</button>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- New sheet: start DM / create GC / create Community -->
  <div id="new-sheet" class="sheet hidden">
    <div class="sheet-panel">
      <div class="sheet-head">
        <h2 id="sheet-title">New</h2>
        <button type="button" class="btn ghost" id="sheet-close">Close</button>
      </div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/chat.js"></script>
</body>
</html>
