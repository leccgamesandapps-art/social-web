<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex" />
  <title>Social Web · Chat</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/water.css" />
  <link rel="stylesheet" href="/chat-layout.css" />
  <script src="/public-config.js"></script>
</head>
<body class="chat-page water-bg">
  <div class="water-layer" aria-hidden="true"></div>
  <div id="guard" class="loader-screen"><div class="spinner"></div><p>Checking session...</p></div>
  <div id="sw-modal-root"></div>
  <div id="app" class="chat-shell hidden">
    <header class="chat-top1">
      <a href="/dashboard#home" class="feed-btn">← Feed</a>
      <div class="chat-brand">
        <svg viewBox="0 0 48 48" width="28" height="28" fill="none"><rect width="48" height="48" rx="12" fill="url(#cg)"/><circle cx="24" cy="24" r="10" stroke="white" stroke-width="3"/><circle cx="24" cy="24" r="4" fill="white"/><defs><linearGradient id="cg" x1="0" y1="0" x2="48" y2="48"><stop stop-color="#5b8cff"/><stop offset="1" stop-color="#8b7cff"/></linearGradient></defs></svg>
        <span>Chat</span>
      </div>
      <span class="feed-btn spacer"></span>
    </header>
    <nav class="chat-tabs" id="chat-tabs">
      <button type="button" class="chat-tab active" data-tab="chat">Chat</button>
      <button type="button" class="chat-tab" data-tab="gc">GC</button>
      <button type="button" class="chat-tab" data-tab="community">Community</button>
    </nav>
    <div class="chat-body">
      <aside class="chat-list-pane">
        <div class="chat-list-head">
          <span id="list-title">Chats</span>
          <button type="button" class="btn small" id="list-add-btn">+</button>
        </div>
        <div class="chat-list" id="chat-list"></div>
      </aside>
      <main class="chat-panel-pane">
        <div class="chat-panel-head" id="panel-title">Select a conversation</div>
        <div class="chat-panel-messages" id="panel-messages">
          <div class="empty"><p>Choose a chat from the list</p></div>
        </div>
        <div class="chat-panel-compose" id="panel-compose">
          <input id="panel-input" placeholder="Message…" disabled />
          <button type="button" class="btn primary" id="panel-send" disabled>Send</button>
        </div>
      </main>
    </div>
  </div>
  <script src="/db.js"></script>
  <script src="/admin-db.js"></script>
  <script src="/db-secure.js"></script>
  <script src="/db-roles.js"></script>
  <script src="/chat-auth.js"></script>
  <script src="/chat-ui.js"></script>
  <script src="/community-settings-ui.js"></script>
  <script src="/chat-invite.js"></script>
</body>
</html>
