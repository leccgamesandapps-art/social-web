<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0b0d14" />
  <title>Social Web</title>
  <link rel="stylesheet" href="/assets/css/core.css" />
  <link rel="stylesheet" href="/assets/css/dashboard.css" />
</head>
<body class="dash-body">
  <div class="bg-animated" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div id="guard" class="loader-screen">
    <div class="logo-mark">
      <svg viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="14" fill="url(#lgd)"/><circle cx="24" cy="24" r="11" stroke="#fff" stroke-width="2.5"/><circle cx="24" cy="24" r="4" fill="#fff"/><defs><linearGradient id="lgd" x1="0" y1="0" x2="48" y2="48"><stop stop-color="#6c5ce7"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs></svg>
    </div>
    <div class="spinner"></div>
    <p>Checking session…</p>
  </div>

  <div id="app" class="app hidden">
    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand-center">
          <div class="logo-mark xs">
            <svg viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="14" fill="url(#lgx)"/><circle cx="24" cy="24" r="11" stroke="#fff" stroke-width="2.5"/><circle cx="24" cy="24" r="4" fill="#fff"/><defs><linearGradient id="lgx" x1="0" y1="0" x2="48" y2="48"><stop stop-color="#6c5ce7"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs></svg>
          </div>
          <span>Social Web</span>
        </div>
      </div>
    </header>

    <!-- Main content area (views swap here) -->
    <main id="main" class="main">
      <section data-view="home" class="view active">
        <div class="view-head"><h2>Home</h2></div>
        <div id="feed" class="feed"><div class="empty-state">Your feed will appear here</div></div>
      </section>

      <section data-view="search" class="view">
        <div class="view-head"><h2>Search</h2></div>
        <div class="search-box">
          <input type="search" id="search-input" placeholder="Search people or posts…" />
        </div>
        <div id="search-results" class="list"></div>
      </section>

      <section data-view="create" class="view">
        <div class="view-head"><h2>Create</h2></div>
        <div class="create-card">
          <textarea id="post-content" rows="5" placeholder="What's on your mind?"></textarea>
          <button type="button" class="btn primary full" id="btn-post">Post</button>
        </div>
      </section>

      <section data-view="profile" class="view">
        <div class="view-head"><h2>My Profile</h2></div>
        <div id="profile-card" class="profile-card"></div>
        <div id="profile-posts" class="feed"></div>
      </section>

      <section data-view="profile-edit" class="view">
        <div class="view-head"><h2>Edit Profile</h2></div>
        <div class="settings-card">
          <div class="field"><label>Display name</label><input id="edit-displayname" type="text" maxlength="32" /></div>
          <div class="field"><label>Bio</label><textarea id="edit-bio" rows="3" maxlength="200"></textarea></div>
          <button type="button" class="btn primary full" id="btn-save-profile">Save</button>
        </div>
      </section>

      <section data-view="friends" class="view">
        <div class="view-head"><h2>Friends</h2></div>
        <div class="subtabs">
          <button type="button" class="subtab active" data-sub="list">All</button>
          <button type="button" class="subtab" data-sub="requests">Requests</button>
          <button type="button" class="subtab" data-sub="pending">Pending</button>
        </div>
        <div id="friends-list" class="list"></div>
      </section>

      <section data-view="notifications" class="view">
        <div class="view-head"><h2>Notifications</h2></div>
        <div class="subtabs">
          <button type="button" class="subtab active" data-sub="all">All</button>
          <button type="button" class="subtab" data-sub="activity">Activity</button>
          <button type="button" class="subtab" data-sub="system">System</button>
        </div>
        <div id="notif-list" class="list"></div>
      </section>

      <section data-view="settings" class="view">
        <div class="view-head"><h2>Settings</h2></div>
        <div class="settings-card">
          <div class="settings-group">
            <label class="group-label">Theme (this device only)</label>
            <div class="theme-row">
              <button type="button" class="btn ghost theme-btn" data-theme="dark">Dark</button>
              <button type="button" class="btn ghost theme-btn" data-theme="light">Light</button>
              <button type="button" class="btn ghost theme-btn" data-theme="purple">Purple</button>
              <button type="button" class="btn ghost theme-btn" data-theme="oled">OLED</button>
            </div>
            <p class="hint">Theme is saved only on this phone. Other devices keep their own theme.</p>
          </div>
          <div class="settings-group">
            <label class="group-label">Account</label>
            <p class="hint" id="settings-account">—</p>
            <button type="button" class="btn full" id="btn-switch-account">Switch account</button>
            <button type="button" class="btn full" id="btn-logout">Logout</button>
          </div>
          <div class="settings-group danger">
            <label class="group-label">Danger zone</label>
            <button type="button" class="btn danger full" id="btn-delete-account">Delete account</button>
          </div>
        </div>
      </section>

      <section data-view="user" class="view">
        <div class="view-head"><h2 id="user-title">User</h2></div>
        <div id="user-card" class="profile-card"></div>
        <div id="user-posts" class="feed"></div>
      </section>

      <section data-view="post" class="view">
        <div class="view-head"><button type="button" class="btn ghost" id="btn-back-post">← Back</button><h2>Post</h2></div>
        <div id="single-post"></div>
        <div class="comments-box">
          <h3>Comments</h3>
          <div id="comments-list"></div>
          <div class="comment-input-row">
            <input id="comment-input" type="text" placeholder="Write a comment…" />
            <button type="button" class="btn primary" id="btn-comment">Send</button>
          </div>
        </div>
      </section>

      <section data-view="error" class="view">
        <div class="empty-state">
          <div class="empty-icon">⚠️</div>
          <p>Page not found</p>
          <button type="button" class="btn primary" id="btn-error-home">Go Home</button>
        </div>
      </section>
    </main>

    <!-- Bottom navigation -->
    <nav class="bottom-nav">
      <a href="#home" class="nav-item active" data-nav="home"><span class="ico">🏠</span><span>Home</span></a>
      <a href="#search" class="nav-item" data-nav="search"><span class="ico">🔍</span><span>Search</span></a>
      <a href="#create" class="nav-item" data-nav="create"><span class="ico">✏️</span><span>Create</span></a>
      <a href="/chat" class="nav-item" data-nav="chat"><span class="ico">💬</span><span>Chat</span></a>
      <button type="button" class="nav-item" id="btn-menu" data-nav="menu"><span class="ico">☰</span><span>Menu</span></button>
    </nav>
  </div>

  <!-- Full-screen Menu popup -->
  <div id="menu-overlay" class="menu-overlay hidden">
    <div class="menu-panel">
      <div class="menu-head">
        <h2>Menu</h2>
        <button type="button" class="btn ghost" id="btn-menu-close">Close</button>
      </div>
      <div class="menu-list">
        <button type="button" class="menu-item" data-goto="profile">My profile</button>
        <button type="button" class="menu-item" data-goto="friends">Friends</button>
        <button type="button" class="menu-item" data-goto="notifications">Notifications</button>
        <button type="button" class="menu-item" data-goto="settings">Settings</button>
      </div>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/dashboard.js"></script>
</body>
</html>
