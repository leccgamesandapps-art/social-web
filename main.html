<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Social Web</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/public-config.js"></script>
  <script>
    (function(){
      document.addEventListener('contextmenu', e => e.preventDefault());
      document.addEventListener('keydown', e => {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) || (e.ctrlKey && e.key === 'U')) {
          e.preventDefault(); e.stopPropagation();
        }
      });
    })();
  </script>
</head>
<body>
  <div id="loader" class="loader-screen">
    <div class="spinner"></div>
    <p>Loading Social Web...</p>
  </div>

  <div id="auth-container" class="auth-container hidden">
    <div class="auth-card">
      <div class="auth-logo">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="12" fill="url(#gradAuth)"/>
          <path d="M12 20c0-4.4 3.6-8 8-8s8 3.6 8 8-3.6 8-8 8" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="20" cy="20" r="3" fill="#fff"/>
          <defs>
            <linearGradient id="gradAuth" x1="0" y1="0" x2="40" y2="40">
              <stop stop-color="#7c6cff"/>
              <stop offset="1" stop-color="#a78bfa"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1>Social Web</h1>
      <p class="subtitle">Connect. Share. Discover.</p>

      <div class="tabs">
        <button id="tab-login" class="tab active">Login</button>
        <button id="tab-register" class="tab">Register</button>
      </div>

      <form id="login-form" class="auth-form">
        <input type="text" id="login-username" placeholder="Username" required autocomplete="username" />
        <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password" />
        <button type="submit" class="btn primary">Login</button>
        <p id="login-error" class="error"></p>
      </form>

      <form id="register-form" class="auth-form hidden">
        <input type="text" id="reg-username" placeholder="Username" required minlength="3" maxlength="20" />
        <input type="password" id="reg-password" placeholder="Password" required minlength="6" />
        <input type="password" id="reg-confirm" placeholder="Confirm Password" required />
        <input type="text" id="reg-displayname" placeholder="Display Name" required maxlength="30" />
        <button type="submit" class="btn primary">Create Account</button>
        <p id="reg-error" class="error"></p>
      </form>
    </div>
  </div>

  <script src="/db.js"></script>
  <script src="/admin-db.js"></script>
  <script src="/db-secure.js"></script>
  <script src="/auth.js"></script>
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('auth-container').classList.remove('hidden');
        if (DB.getSession()) {
          window.location.replace('/dashboard');
        }
      }, 900);
    });
  </script>
</body>
</html>
