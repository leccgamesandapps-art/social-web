<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>LE Social Web · Database SQL Console</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body.db-page { margin:0; background:#0b0d14; color:#e8e8f0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .db-wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .db-top { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px; }
    .db-top h1 { margin:0; font-size:1.1rem; font-family: system-ui, sans-serif; }
    .badge { font-size:.7rem; padding:4px 8px; border-radius:999px; background:#1e2438; }
    .badge.ok { background:#143d28; color:#7dffa0; }
    .badge.bad { background:#3d1414; color:#ff8a8a; }
    .panel { background:#121622; border:1px solid #252a3d; border-radius:12px; padding:12px; margin-bottom:12px; }
    label { display:block; font-size:.75rem; color:#9aa0b8; margin-bottom:6px; font-family:system-ui,sans-serif; }
    input[type=password], textarea { width:100%; background:#0a0c12; color:#e8e8f0; border:1px solid #2a3148; border-radius:8px; padding:10px; font: inherit; box-sizing:border-box; }
    textarea { min-height: 140px; resize: vertical; line-height:1.4; }
    .row { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .btn { border:none; border-radius:8px; padding:8px 12px; cursor:pointer; font-weight:700; font-family: system-ui, sans-serif; font-size:.8rem; }
    .btn.primary { background:#5b6cff; color:#fff; }
    .btn.ghost { background:#1a1f30; color:#c8cce0; }
    .tables { display:flex; flex-wrap:wrap; gap:6px; }
    .result-meta { font-size:.75rem; color:#9aa0b8; margin:8px 0; font-family:system-ui,sans-serif; }
    .err { color:#ff8a8a; white-space:pre-wrap; font-size:.85rem; }
    .table-scroll { overflow:auto; max-height: 55vh; border:1px solid #252a3d; border-radius:8px; }
    table.sql-table { border-collapse: collapse; width:100%; font-size:.75rem; }
    table.sql-table th, table.sql-table td { border-bottom:1px solid #252a3d; padding:6px 8px; text-align:left; vertical-align:top; max-width: 280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    table.sql-table th { position:sticky; top:0; background:#1a1f30; color:#aab0c8; }
    .hint { font-size:.75rem; color:#8a90a8; font-family:system-ui,sans-serif; line-height:1.5; }
    a { color:#8da2ff; }
  </style>
</head>
<body class="db-page">
  <div class="db-wrap">
    <div class="db-top">
      <h1>Database SQL Console</h1>
      <span class="badge" id="db-badge">checking…</span>
      <a href="/owner" style="margin-left:auto;font-size:.8rem;font-family:system-ui">Owner panel</a>
      <a href="/" style="font-size:.8rem;font-family:system-ui">App</a>
    </div>
    <div class="panel">
      <label>SW_SECRET_KEY (Vercel Environment Variable — required to run SQL)</label>
      <input type="password" id="secret-key" placeholder="Paste Vercel SW_SECRET_KEY" autocomplete="off" />
      <p class="hint" style="margin-top:8px">Real SQL console for server <strong>Postgres</strong>. Status: <a href="/api/db/status" target="_blank">/api/db/status</a></p>
    </div>
    <div class="panel">
      <div class="row" style="margin-top:0">
        <button type="button" class="btn primary" id="btn-setup">1) Create / verify tables</button>
        <button type="button" class="btn ghost" id="btn-tables">2) List tables</button>
        <button type="button" class="btn ghost" id="btn-users">SELECT users</button>
        <button type="button" class="btn ghost" id="btn-posts">SELECT posts</button>
      </div>
      <div class="tables" id="table-list" style="margin-top:10px"></div>
    </div>
    <div class="panel">
      <label>SQL command</label>
      <textarea id="sql-input">SELECT username, display_name, status, created_at FROM users ORDER BY id DESC LIMIT 50;</textarea>
      <div class="row">
        <button type="button" class="btn primary" id="btn-run">Run SQL</button>
        <button type="button" class="btn ghost" id="btn-clear">Clear result</button>
      </div>
      <p class="hint">Examples: <code>SELECT * FROM users;</code> · <code>SELECT * FROM posts;</code></p>
    </div>
    <div class="panel">
      <div class="result-meta" id="result-meta">No query yet</div>
      <div id="result-error" class="err"></div>
      <div class="table-scroll" id="result-box"></div>
    </div>
  </div>
  <script>
    const badge = document.getElementById('db-badge');
    const secretEl = document.getElementById('secret-key');
    const sqlEl = document.getElementById('sql-input');
    const meta = document.getElementById('result-meta');
    const errEl = document.getElementById('result-error');
    const box = document.getElementById('result-box');
    const tableList = document.getElementById('table-list');
    secretEl.value = sessionStorage.getItem('sw_sql_secret') || '';
    secretEl.addEventListener('change', () => sessionStorage.setItem('sw_sql_secret', secretEl.value));
    async function checkStatus() {
      try {
        const j = await (await fetch('/api/db/status', { cache: 'no-store' })).json();
        if (j.databaseConfigured) { badge.textContent = 'Postgres connected'; badge.className = 'badge ok'; }
        else { badge.textContent = 'Postgres NOT connected'; badge.className = 'badge bad'; }
      } catch (e) { badge.textContent = 'Status error'; badge.className = 'badge bad'; }
    }
    function secret() { return secretEl.value.trim(); }
    async function api(body) {
      errEl.textContent = '';
      const r = await fetch('/api/db/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-sw-secret': secret() },
        body: JSON.stringify(Object.assign({ secretKey: secret() }, body))
      });
      return await r.json();
    }
    function esc(s) { return String(s).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"'); }
    function renderRows(fields, rows) {
      if (!fields || !fields.length) { box.innerHTML = '<p class="hint">OK — no rows returned</p>'; return; }
      let h = '<table class="sql-table"><thead><tr>' + fields.map(f => '<th>' + esc(f) + '</th>').join('') + '</tr></thead><tbody>';
      rows.forEach(row => {
        h += '<tr>' + fields.map(f => {
          let v = row[f];
          if (v === null || v === undefined) v = 'NULL';
          else if (typeof v === 'object') v = JSON.stringify(v);
          return '<td title="' + esc(String(v)) + '">' + esc(String(v)) + '</td>';
        }).join('') + '</tr>';
      });
      h += '</tbody></table>';
      box.innerHTML = h;
    }
    async function runSql(sql) {
      meta.textContent = 'Running…';
      const j = await api({ action: 'sql', sql });
      if (!j.ok) { meta.textContent = 'Error'; errEl.textContent = j.error + (j.code ? ' (' + j.code + ')' : ''); box.innerHTML = ''; return; }
      meta.textContent = (j.command || 'QUERY') + ' · rows: ' + (j.rowCount ?? j.rows.length) + ' · ' + j.durationMs + ' ms';
      renderRows(j.fields, j.rows);
    }
    document.getElementById('btn-run').onclick = () => runSql(sqlEl.value);
    document.getElementById('btn-clear').onclick = () => { box.innerHTML = ''; errEl.textContent = ''; meta.textContent = 'Cleared'; };
    document.getElementById('btn-setup').onclick = async () => {
      meta.textContent = 'Creating tables…';
      const j = await api({ action: 'setup' });
      if (!j.ok) { errEl.textContent = j.error; meta.textContent = 'Error'; return; }
      meta.textContent = j.message;
      tableList.innerHTML = (j.tables || []).map(t => '<button type="button" class="btn ghost" data-t="' + esc(t) + '">' + esc(t) + '</button>').join('');
      bindTableButtons();
    };
    document.getElementById('btn-tables').onclick = async () => {
      const j = await api({ action: 'tables' });
      if (!j.ok) { errEl.textContent = j.error; return; }
      tableList.innerHTML = (j.tables || []).map(t => '<button type="button" class="btn ghost" data-t="' + esc(t) + '">' + esc(t) + '</button>').join('');
      bindTableButtons();
      meta.textContent = 'Tables: ' + (j.tables || []).join(', ');
    };
    document.getElementById('btn-users').onclick = () => { sqlEl.value = 'SELECT id, username, display_name, status, created_at FROM users ORDER BY id DESC LIMIT 100;'; runSql(sqlEl.value); };
    document.getElementById('btn-posts').onclick = () => { sqlEl.value = 'SELECT id, author, content, created_at FROM posts ORDER BY created_at DESC LIMIT 100;'; runSql(sqlEl.value); };
    function bindTableButtons() {
      tableList.querySelectorAll('[data-t]').forEach(b => {
        b.onclick = () => { const t = b.getAttribute('data-t'); sqlEl.value = 'SELECT * FROM ' + t + ' LIMIT 100;'; runSql(sqlEl.value); };
      });
    }
    checkStatus();
  </script>
</body>
</html>
